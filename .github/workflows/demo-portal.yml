name: Demo Portal CI and Image Publish

on:
  pull_request:
    paths:
      - 'apps/demo-portal/**'
      - '.github/workflows/demo-portal.yml'
  push:
    branches: [main]
    paths:
      - 'apps/demo-portal/**'
      - '.github/workflows/demo-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax
        run: node --check apps/demo-portal/main.js
      - name: Validate registry and commerce flows
        run: node --test apps/demo-portal/tests/*.test.mjs
      - name: Build deployable nginx image
        run: docker build -f apps/demo-portal/Dockerfile -t ads-demo-portal:ci .
      - name: Smoke test image and deep-link routes
        run: |
          set -euo pipefail
          docker run -d --name ads-demo-portal-ci -p 127.0.0.1:18888:80 ads-demo-portal:ci
          trap 'docker rm -f ads-demo-portal-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if curl --fail -s http://127.0.0.1:18888/ >/dev/null; then break; fi
            sleep 1
          done
          # Avoid SIGPIPE from curl | grep -q under pipefail when the
          # response body is larger than a pipe buffer.
          for route in /platforms/commerce /opportunities/pos /cloud; do
            curl --fail --silent --show-error "http://127.0.0.1:18888$route" -o /tmp/ads-demo-route.html
            grep -Fq 'ADS Digital Ecosystem' /tmp/ads-demo-route.html
          done
          curl --fail --silent --show-error http://127.0.0.1:18888/catalogue.json -o /tmp/ads-demo-catalogue.json
          grep -Fq '"ecommerce"' /tmp/ads-demo-catalogue.json

  browser-discovery:
    name: Chromium opportunity discovery acceptance
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test library (Chromium provided by verified image)
        run: npm install --prefix apps/demo-portal --no-save --no-audit --no-fund playwright@1.56.1
      - name: Interact with all sectors, local businesses and regulators
        run: node --test apps/demo-portal/tests/browser-discovery-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunities-interactive-browser
          path: /tmp/ads-opportunities-*.png
          if-no-files-found: ignore

  ux-screenshots:
    name: UX before-after EN-FR 360-768-1280
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-demo
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Chromium test library
        run: npm install --prefix apps/demo-portal --no-save --no-audit --no-fund playwright@1.56.1
      - name: Capture 60 before-after screenshots without secrets or live accounts
        run: node --test apps/demo-portal/tests/browser-ux-screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ads-portal-ux-before-after
          path: ux-screenshots/*.png
          retention-days: 30
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ads-demo-portal
          tags: |
            type=sha,format=long
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo-portal/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - run: echo "Published image to GHCR. No automatic Contabo deployment."
