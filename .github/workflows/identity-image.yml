name: ADS Identity — verified Docker image

on:
  pull_request:
    paths:
      - 'services/identity/**'
      - 'packages/identity-client/**'
      - 'config/clients.demo.json'
      - '.github/workflows/identity-image.yml'
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - 'packages/identity-client/**'
      - 'config/clients.demo.json'
      - '.github/workflows/identity-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kit -d kit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/identity/package-lock.json
      - name: Install identity dependencies
        working-directory: services/identity
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        working-directory: services/identity
        run: npm audit --omit=dev --audit-level=high
      - name: Test identity and demo-account restrictions
        working-directory: services/identity
        env:
          TEST_DATABASE_URL: postgres://kit:kit@127.0.0.1:5432/kit_test
        run: npm test
      - name: Validate and build image
        run: docker build -f services/identity/Dockerfile -t ads-identity:verify .

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version tags (commit-specific for rollback)
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ads-platform-kit-identity
          tags: |
            type=sha,format=long
            type=raw,value=main
      - name: Publish approved-build candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/identity/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Confirm publishing is not deployment
        run: echo "Image published; no production identity, database, or Contabo container was changed."
