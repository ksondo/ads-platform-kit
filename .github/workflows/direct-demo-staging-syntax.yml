name: Direct Contabo nine-site release plan checks
on:
  pull_request:
    paths:
      - 'deploy/contabo-demo/direct-apps-preflight.sh'
      - 'deploy/contabo-demo/direct-apps-runtime-audit.sh'
      - 'deploy/contabo-demo/stage-direct-apps.sh'
      - 'deploy/contabo-demo/prepare-private-app-github-access.sh'
      - 'deploy/contabo-demo/bootstrap-direct-app-cache.sh'
      - 'deploy/contabo-demo/build-staged-demo-images.sh'
      - 'deploy/contabo-demo/prepare-five-demo-databases.sh'
      - 'deploy/contabo-demo/migrate-five-demo-schemas.sh'
      - 'deploy/contabo-demo/provision-five-demo-runtime-logins.sh'
      - 'deploy/contabo-demo/launch-five-demo-apps.sh'
      - 'deploy/contabo-demo/publish-five-demo-https.sh'
      - 'deploy/contabo-demo/release-nine-demo-apps.sh'
      - 'deploy/contabo-demo/release-nine-manifest.json'
      - 'deploy/contabo-demo/DIRECT_APPS_ROLLOUT_20261026.md'
      - 'deploy/contabo-demo/NINE_SITE_RELEASE_EXECUTION_PLAN.md'
      - '.github/workflows/direct-demo-staging-syntax.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax, schema and fail-closed deployment
        shell: bash
        run: |
          set -euo pipefail
          for sh in deploy/contabo-demo/direct-apps-preflight.sh deploy/contabo-demo/direct-apps-runtime-audit.sh deploy/contabo-demo/stage-direct-apps.sh deploy/contabo-demo/prepare-private-app-github-access.sh deploy/contabo-demo/bootstrap-direct-app-cache.sh deploy/contabo-demo/build-staged-demo-images.sh deploy/contabo-demo/prepare-five-demo-databases.sh deploy/contabo-demo/migrate-five-demo-schemas.sh deploy/contabo-demo/provision-five-demo-runtime-logins.sh deploy/contabo-demo/launch-five-demo-apps.sh deploy/contabo-demo/publish-five-demo-https.sh deploy/contabo-demo/release-nine-demo-apps.sh; do
            bash -n "$sh"
          done
          python3 -m json.tool deploy/contabo-demo/release-nine-manifest.json > /dev/null
          bash deploy/contabo-demo/release-nine-demo-apps.sh --plan | tee /tmp/ads-nine-plan.txt
          grep -q 'BLOCKED_RELEASES:' /tmp/ads-nine-plan.txt
          grep -q 'STATUS=PLAN_ONLY' /tmp/ads-nine-plan.txt
          set +e
          bash deploy/contabo-demo/release-nine-demo-apps.sh --apply > /tmp/ads-nine-refusal.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 3
          grep -q 'ADS_NINE_DEPLOYMENT_REFUSED' /tmp/ads-nine-refusal.txt
          for sh in deploy/contabo-demo/direct-apps-preflight.sh deploy/contabo-demo/direct-apps-runtime-audit.sh; do
            ! grep -En '(docker (run|rm|compose .*up|system prune)|nginx -s reload|systemctl (restart|reload)|certbot|psql -c|git (pull|reset))' "$sh"
          done
          ! grep -En '(docker (run|rm|compose .*up|system prune)|nginx -s reload|systemctl (restart|reload)|certbot|psql -c)' deploy/contabo-demo/stage-direct-apps.sh
          bash deploy/contabo-demo/prepare-private-app-github-access.sh --plan > /tmp/ads-readonly-keys-plan.txt
          grep -q 'KEY_REQUIRED education' /tmp/ads-readonly-keys-plan.txt
          bash deploy/contabo-demo/bootstrap-direct-app-cache.sh --plan education > /tmp/ads-readonly-cache-plan.txt
          grep -q 'PLAN_ONLY' /tmp/ads-readonly-cache-plan.txt
          ! grep -En '(docker (run|rm|compose .*up|system prune)|nginx -s reload|systemctl (restart|reload)|certbot|psql -c)' deploy/contabo-demo/build-staged-demo-images.sh
          grep -q 'ADS_FIVE_DATABASE_FOUNDATIONS=PASS' deploy/contabo-demo/prepare-five-demo-databases.sh
          grep -q 'MIGRATIONS=NOT_RUN' deploy/contabo-demo/prepare-five-demo-databases.sh
          grep -q 'REFUSED: unexpected published DB port' deploy/contabo-demo/prepare-five-demo-databases.sh
          grep -q 'DATABASE_URL=postgresql://' deploy/contabo-demo/migrate-five-demo-schemas.sh
          grep -q 'SCHEMA_VERIFICATION_FAILED' deploy/contabo-demo/migrate-five-demo-schemas.sh
          grep -q 'ADS_FIVE_RESTRICTED_RUNTIME_LOGINS=PASS' deploy/contabo-demo/provision-five-demo-runtime-logins.sh
          grep -q 'MAMACARE_JOB_POOL=REQUIRES_APP_CHANGE' deploy/contabo-demo/provision-five-demo-runtime-logins.sh
          grep -q 'APPS=NOT_STARTED' deploy/contabo-demo/provision-five-demo-runtime-logins.sh
          grep -q -- '--runtime-plan' deploy/contabo-demo/release-nine-demo-apps.sh
          grep -q -- '--provision-runtimes' deploy/contabo-demo/release-nine-demo-apps.sh
          grep -q -- '--runtime-verify' deploy/contabo-demo/release-nine-demo-apps.sh
          grep -q 'ADS_FIVE_PRIVATE_APPS=PASS' deploy/contabo-demo/launch-five-demo-apps.sh
          grep -q 'ADS_FIVE_HTTPS=PASS' deploy/contabo-demo/publish-five-demo-https.sh
          grep -q 'PUBLIC_HTTPS=NOT_CONFIGURED' deploy/contabo-demo/launch-five-demo-apps.sh
          grep -q 'PORTAL_LINKS=UNCHANGED' deploy/contabo-demo/publish-five-demo-https.sh
          grep -q -- '--deploy-five-apps' deploy/contabo-demo/release-nine-demo-apps.sh
          echo ADS_NINE_RELEASE_PLAN_CHECKS=PASS
