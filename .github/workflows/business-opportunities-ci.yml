name: Business Opportunities — database and portal isolation checks
on:
  pull_request:
    paths:
      - 'services/business-opportunities/**'
      - 'apps/demo-portal/**'
      - '.github/workflows/business-opportunities-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/business-opportunities/**'
      - 'apps/demo-portal/**'
      - '.github/workflows/business-opportunities-ci.yml'
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ads_opportunities_ci
          POSTGRES_HOST_AUTH_METHOD: trust # isolated ephemeral CI only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ads_opportunities_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate immutable catalogue source and Node syntax
        run: |
          set -euo pipefail
          node services/business-opportunities/validate-seed.mjs
          node --check services/business-opportunities/server.mjs
          node --check services/business-opportunities/seed.mjs
          node --check apps/demo-portal/main.js
          node --check apps/demo-portal/opportunities-v2.js
          node --check services/business-opportunities/discovery.mjs
          node --check services/business-opportunities/seed-discovery.mjs
          bash -n services/business-opportunities/scripts/bootstrap-contabo.sh
          bash -n services/business-opportunities/scripts/release-directory-api-git-direct.sh
          python3 -m py_compile services/business-opportunities/scripts/publish-https-ingress.py
          python3 -m unittest discover -s services/business-opportunities/tests -p 'test_https_ingress.py' -v
          node --test apps/demo-portal/tests/*.test.mjs
      - name: Install isolated API dependencies and apply real Postgres schema
        env:
          PGURL: postgresql://postgres@127.0.0.1:5432/ads_opportunities_ci
        run: |
          set -euo pipefail
          npm install --prefix services/business-opportunities --no-audit --no-fund
          psql "$PGURL" -v ON_ERROR_STOP=1 -f services/business-opportunities/db/001_catalogue.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f services/business-opportunities/db/002_discovery.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE ads_opportunities_reader LOGIN; GRANT USAGE ON SCHEMA opportunities TO ads_opportunities_reader; GRANT SELECT ON ALL TABLES IN SCHEMA opportunities TO ads_opportunities_reader;'
      - name: Seed twice to prove idempotence and assert 49/328/52
        env:
          OPPORTUNITIES_MIGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ads_opportunities_ci
        run: |
          set -euo pipefail
          cd services/business-opportunities
          node seed.mjs
          node seed.mjs
          node seed-discovery.mjs
          node seed-discovery.mjs
          node --test tests/*.test.mjs
          psql "$OPPORTUNITIES_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT (SELECT count(*) FROM opportunities.sectors)::text || '/' || (SELECT count(*) FROM opportunities.sector_opportunities)::text || '/' || (SELECT count(*) FROM opportunities.business_types)::text" | grep -x '49/328/52'
      - name: Smoke actual HTTP read API and keep homepage source unchanged
        env:
          OPPORTUNITIES_DATABASE_URL: postgresql://ads_opportunities_reader@127.0.0.1:5432/ads_opportunities_ci
        run: |
          set -euo pipefail
          node services/business-opportunities/server.mjs &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:31090/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:31090/api/opportunities/v1/sectors' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(JSON.parse(s).total!==49)process.exit(1)})"
          curl -fsS 'http://127.0.0.1:31090/api/opportunities/v1/opportunities?limit=1' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(JSON.parse(s).total!==328)process.exit(1)})"
          curl -fsS 'http://127.0.0.1:31090/api/opportunities/v1/businesses?limit=100' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const j=JSON.parse(s);if(j.total!==52||j.data.length!==52||!j.data.some(x=>/sawmill/i.test(x.name)))process.exit(1)})"
          curl -fsS 'http://127.0.0.1:31090/api/opportunities/v1/businesses/suggest?q=sawmill' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(JSON.parse(s).total<1)process.exit(1)})"
          curl -fsS 'http://127.0.0.1:31090/api/opportunities/v1/discovery/categories?family=business' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(JSON.parse(s).total!==13)process.exit(1)})"
          curl -fsS 'http://127.0.0.1:31090/api/opportunities/v1/discovery/categories?family=institutional' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(JSON.parse(s).total!==8)process.exit(1)})"
          curl -fsS 'http://127.0.0.1:31090/api/opportunities/v1/discovery/solutions?family=business&limit=1' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(JSON.parse(s).total!==101)process.exit(1)})"
          curl -fsS 'http://127.0.0.1:31090/api/opportunities/v1/discovery/solutions?family=institutional&limit=1' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(JSON.parse(s).total!==20)process.exit(1)})"
          curl -fsS 'http://127.0.0.1:31090/api/opportunities/v1/discovery/solutions/business-wood-processor-sawmill' | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{let d=JSON.parse(s).data;if(!d || d.tools.length<4)process.exit(1)})"
          echo 'ADS_BUSINESS_OPPORTUNITIES_POSTGRES_API=PASS'
