name: Publish ADS Platform Kit identity image

on:
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - 'packages/identity-client/**'
      - 'config/**'
      - '.github/workflows/publish-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ads-platform-kit-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kit -d kit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/identity/package-lock.json
      - name: Install dependencies
        working-directory: services/identity
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        working-directory: services/identity
        run: npm audit --omit=dev --audit-level=high
      - name: Test identity
        working-directory: services/identity
        env:
          TEST_DATABASE_URL: postgres://kit:kit@127.0.0.1:5432/kit_test
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ads-platform-kit-identity
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/identity/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Deployment handoff
        run: |
          echo "Image published to GHCR. No Contabo server changes were made."
          echo "Deploy only after validating identity DB migration, secrets, ingress, backups and rollback."
