# Proves the reusable e2e template works: runs it against examples/sample-product using the kit
# at this commit, exactly as a product repo would call it.
name: e2e-selftest

# Browser e2e (Playwright): pull requests and manual runs only, never on push to main (CI cost, owner rule
# 11 Nov 2026).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-product:
    uses: ./.github/workflows/e2e-template.yml
    with:
      client-id: sample-web
      working-directory: examples/sample-product
      kit-repository: ${{ github.repository }}
      kit-ref: ${{ github.sha }}
      test-command: npx playwright test
