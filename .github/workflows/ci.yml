name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kit -d kit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/identity/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://kit:kit@127.0.0.1:5432/kit_test
      - name: Docker image builds
        working-directory: .
        run: docker build -f services/identity/Dockerfile -t ads-identity:ci .
