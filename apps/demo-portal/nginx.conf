server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://images.unsplash.com https://commons.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org data:; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

  location = /catalogue.json {
    default_type application/json;
  }
  # Missing activation file must be a 404, never the SPA fallback (the portal then keeps every demo 'preparing').
  # Operator override first: compose.portal.yml mounts the host directory /etc/ads-demo/portal read-only at
  # /etc/ads-portal-operator. Only demo-activation.json is ever served from it. When the host file is absent
  # (or the directory is not mounted), the bundled file applies, which ships every product as 'preparing'.
  location = /demo-activation.json {
    default_type application/json;
    root /etc/ads-portal-operator;
    try_files $uri @bundled-demo-activation;
  }
  location @bundled-demo-activation {
    default_type application/json;
    root /usr/share/nginx/html;
    try_files /demo-activation.json =404;
  }
  location ~* \.(css|js)$ {
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
